name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:prototype
      - run: node --import tsx --test --test-force-exit --test-isolation=none test/codex-runtime.integration.test.ts
      - run: node --import tsx --test --test-force-exit --test-isolation=none test/database.integration.test.ts
      - run: node --import tsx --test --test-force-exit --test-isolation=none test/operations.integration.test.ts
      - run: node --import tsx --test --test-force-exit --test-isolation=none test/worker.integration.test.ts
